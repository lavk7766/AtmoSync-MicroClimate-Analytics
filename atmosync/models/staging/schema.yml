version: 2

models:
  - name: stg_container_telemetry
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: container_id
        tests:
          - not_null
      - name: event_ts
        tests:
          - not_null

  - name: stg_commodity_prices
    columns:
      - name: market_name
        tests:
          - not_null
      - name: price_per_kg
        tests:
          - not_null